# The orchestrator API has no authentication, so both ports are published on the host's loopback only.
services:
  shortener:
    build: .
    image: agentic-sdlc-orchestrator
    command: ["python", "-m", "shortener"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      SHORTENER_DATA_FILE: /app/data/shortener.json
    ports:
      - "127.0.0.1:8080:8080"  # no authentication - loopback only
    volumes:
      - ./data:/app/data

  orchestrator:
    build: .
    image: agentic-sdlc-orchestrator
    command: ["python", "-m", "orchestrator"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8090"
    ports:
      - "127.0.0.1:8090:8090"  # no authentication - loopback only
    volumes:
      - ./data:/app/data
